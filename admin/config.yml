backend:
  name: git-gateway
  branch: main

media_folder: "img/uploads"
public_folder: "/img/uploads"

collections:

  - name: "blog"
    label: "Blog Articles"
    label_singular: "Blog Article"
    folder: "_data/blog"
    create: true
    format: "json"
    slug: "{{slug}}"
    identifier_field: "title"
    summary: "{{title}} — {{date}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "URL Slug", name: "slug", widget: "string", hint: "e.g. nyc-bathroom-renovation-cost-guide" }
      - { label: "Publish Date", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "Meta Title", name: "meta_title", widget: "string", hint: "SEO title, max 60 chars" }
      - { label: "Meta Description", name: "meta_description", widget: "text", hint: "SEO description, max 160 chars" }
      - { label: "Excerpt", name: "excerpt", widget: "text", hint: "Short summary for blog listing" }
      - { label: "Featured Image", name: "image", widget: "image", required: false }
      - { label: "Body", name: "body", widget: "markdown" }
      - { label: "Published", name: "published", widget: "boolean", default: true }

  - name: "projects"
    label: "Projects"
    label_singular: "Project"
    folder: "_data/projects"
    create: true
    format: "json"
    slug: "{{slug}}"
    identifier_field: "title"
    summary: "{{title}} — {{location}}"
    fields:
      - { label: "Project Title", name: "title", widget: "string" }
      - { label: "URL Slug", name: "slug", widget: "string" }
      - { label: "Location", name: "location", widget: "string", hint: "e.g. Park Slope, Brooklyn" }
      - { label: "Service Type", name: "service", widget: "select", options: ["Kitchen Remodeling", "Bathroom Renovation", "Co-op & Condo", "Brownstone Renovation", "Electrical Services", "Roofing"] }
      - { label: "Completion Date", name: "date", widget: "string", hint: "e.g. March 2026" }
      - { label: "Cost Range", name: "cost", widget: "string", hint: "e.g. $45,000 - $55,000" }
      - { label: "Duration", name: "duration", widget: "string", hint: "e.g. 6 weeks" }
      - { label: "Description", name: "description", widget: "markdown" }
      - { label: "Cover Photo", name: "cover", widget: "image", required: false }
      - { label: "Gallery Photos", name: "gallery", widget: "list", field: { label: "Photo", name: "photo", widget: "image" }, required: false }
      - { label: "Published", name: "published", widget: "boolean", default: true }

  - name: "reviews"
    label: "Client Reviews"
    label_singular: "Review"
    folder: "_data/reviews"
    create: true
    format: "json"
    slug: "{{slug}}"
    identifier_field: "name"
    fields:
      - { label: "Client Name", name: "name", widget: "string" }
      - { label: "URL Slug", name: "slug", widget: "string" }
      - { label: "Project Type", name: "project", widget: "string", hint: "e.g. Kitchen Renovation" }
      - { label: "Location", name: "location", widget: "string", hint: "e.g. Park Slope, Brooklyn" }
      - { label: "Rating", name: "rating", widget: "number", min: 1, max: 5, default: 5 }
      - { label: "Review Text", name: "body", widget: "text" }
      - { label: "Date", name: "date", widget: "string", hint: "e.g. March 2026" }
      - { label: "Published", name: "published", widget: "boolean", default: true }

  - name: "settings"
    label: "Site Settings"
    files:
      - label: "Business Info"
        name: "business"
        file: "_data/settings.json"
        fields:
          - { label: "Phone Number", name: "phone", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "HIC License", name: "license", widget: "string" }
          - { label: "Top Notice Bar", name: "noticeBar", widget: "string" }
